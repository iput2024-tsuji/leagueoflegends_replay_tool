name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0

      - name: Ruff check
        run: python -m ruff check .

      - name: Create test settings
        run: |
          mkdir -p config
          cp config/setting.sample.json config/setting.json

      - name: Run tests
        run: xvfb-run -a python -m pytest -p no:cacheprovider tests

  build-windows:
    name: Build Windows artifact
    runs-on: windows-latest
    needs: lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Build application
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Package build output
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\LoLReplayTool)) {
            throw "dist\LoLReplayTool was not generated."
          }
          Compress-Archive -Path .\dist\LoLReplayTool -DestinationPath .\dist\LoLReplayTool-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoLReplayTool-windows
          path: dist/LoLReplayTool-windows.zip
          if-no-files-found: error
          retention-days: 14
