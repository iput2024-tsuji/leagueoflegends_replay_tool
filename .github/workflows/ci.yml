name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 post-6.0.0; Windows pip cache fix (#1040)
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Reject tracked external runtimes
        run: python -m scripts.external_runtime_policy --repository-root .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Ruff check
        run: python -m ruff check .

      - name: Create test settings
        run: |
          mkdir -p config
          cp config/setting.sample.json config/setting.json

      - name: Run tests
        run: xvfb-run -a python -m pytest -p no:cacheprovider tests

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: utf8
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 post-6.0.0; Windows pip cache fix (#1040)
        with:
          python-version: "3.14.6"

      - name: Prepare locked Python runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-runtime"
          $runtimeCache = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-runtime-cache"
          $basePython = Join-Path $runtimeRoot "python.exe"
          $venvRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-venv"
          $jobPython = Join-Path $venvRoot "Scripts\python.exe"

          python -m scripts.prepare_release_assets `
            prepare-python-runtime `
            --components .\compliance\components.json `
            --cache-dir $runtimeCache `
            --output-dir $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m scripts.prepare_release_assets `
            verify-python-runtime `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $jobPython -m scripts.prepare_release_assets `
            verify-bootstrap-pip `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WINDOWS_PYTHON=$jobPython" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install test dependencies
        shell: pwsh
        run: |
          & $env:WINDOWS_PYTHON -m pip `
            --isolated `
            --disable-pip-version-check `
            install `
            --no-input `
            --require-virtualenv `
            -r requirements-dev.txt

      - name: Prepare test environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.tmp" | Out-Null
          Copy-Item .\config\setting.sample.json .\config\setting.json -Force

      - name: Run tests
        shell: pwsh
        env:
          TEMP: ${{ github.workspace }}\.tmp
          TMP: ${{ github.workspace }}\.tmp
          PYTEST_BASETEMP: ${{ github.workspace }}\.pytest-tmp
        run: |
          & $env:WINDOWS_PYTHON -m pytest `
            -p no:cacheprovider `
            --basetemp="$env:PYTEST_BASETEMP" `
            tests

  opencv:
    needs: [lint-test, test-windows]
    uses: ./.github/workflows/build-opencv.yml
    with:
      source-ref: ${{ github.sha }}

  build-windows:
    name: Build Windows artifact
    runs-on: windows-2025
    needs: [lint-test, test-windows, opencv]
    env:
      PYTHONIOENCODING: utf8
      OPENCV_SOURCE_COMMIT: ${{ needs.opencv.outputs.source-commit }}
      OPENCV_PROVENANCE_SHA256: ${{ needs.opencv.outputs.provenance-sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up bootstrap Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 post-6.0.0; Windows pip cache fix (#1040)
        with:
          python-version: "3.14.6"

      - name: Prepare locked Python runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-runtime"
          $runtimeCache = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-runtime-cache"
          $basePython = Join-Path $runtimeRoot "python.exe"
          $venvRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-venv"
          $jobPython = Join-Path $venvRoot "Scripts\python.exe"

          python -m scripts.prepare_release_assets `
            prepare-python-runtime `
            --components .\compliance\components.json `
            --cache-dir $runtimeCache `
            --output-dir $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m scripts.prepare_release_assets `
            verify-python-runtime `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $jobPython -m scripts.prepare_release_assets `
            verify-bootstrap-pip `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WINDOWS_PYTHON=$jobPython" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Download verified OpenCV wheel from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.opencv.outputs.artifact-id }}
          path: ${{ runner.temp }}/opencv-source-artifact
          merge-multiple: true

      - name: Install build dependencies
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:OPENCV_SOURCE_COMMIT) {
            throw "OpenCV producer and application checkout commits differ."
          }
          $binaryCache = Join-Path $env:RUNNER_TEMP "LoLReplayTool-binary-cache"
          $generatedRequirements = Join-Path $env:RUNNER_TEMP "build-requirements.txt"
          $installPlan = Join-Path $env:RUNNER_TEMP "build-install-plan.json"
          $pipReport = Join-Path $env:RUNNER_TEMP "build-pip-report.json"
          $buildProvenance = Join-Path $env:RUNNER_TEMP "build-build-provenance.json"

          & $env:WINDOWS_PYTHON -m scripts.prepare_release_assets `
            prepare-binary-install `
            --components .\compliance\components.json `
            --requirements .\requirements-dev.txt `
            --cache-dir $binaryCache `
            --output-requirements $generatedRequirements `
            --output-plan $installPlan `
            --opencv-wheel-directory "$env:RUNNER_TEMP\opencv-source-artifact" `
            --opencv-provenance-sha256 $env:OPENCV_PROVENANCE_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $env:WINDOWS_PYTHON -m pip `
            --isolated `
            --disable-pip-version-check `
            install `
            --no-input `
            --require-virtualenv `
            --no-cache-dir `
            --no-deps `
            --only-binary=:all: `
            --require-hashes `
            --force-reinstall `
            --no-index `
            --report $pipReport `
            -r $generatedRequirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:WINDOWS_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $env:WINDOWS_PYTHON -m scripts.prepare_release_assets `
            attest-binary-install `
            --components .\compliance\components.json `
            --plan $installPlan `
            --pip-report $pipReport `
            --output-provenance $buildProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUILD_PROVENANCE=$buildProvenance" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $innoDownload = Join-Path $env:RUNNER_TEMP "LoLReplayTool-inno-download"
          $innoRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-inno-6.7.3"
          $innoProvenance = Join-Path $env:RUNNER_TEMP "inno-setup-provenance.json"
          .\scripts\prepare_inno_setup.ps1 `
            -PythonExe $env:WINDOWS_PYTHON `
            -Components .\compliance\components.json `
            -DownloadDirectory $innoDownload `
            -InstallDirectory $innoRoot `
            -OutputProvenance $innoProvenance `
            -BuildProvenance $env:BUILD_PROVENANCE
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $buildProvenanceSha256 = (
            Get-FileHash -LiteralPath $env:BUILD_PROVENANCE -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "INNO_SETUP_ROOT=$innoRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "INNO_SETUP_PROVENANCE=$innoProvenance" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          "BUILD_PROVENANCE_SHA256=$buildProvenanceSha256" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Build application
        shell: pwsh
        run: .\scripts\build.ps1 `
          -PythonExe $env:WINDOWS_PYTHON `
          -BuildProvenance $env:BUILD_PROVENANCE `
          -BuildProvenanceSha256 $env:BUILD_PROVENANCE_SHA256

      - name: Validate packaged license materials
        shell: pwsh
        run: |
          & $env:WINDOWS_PYTHON -m scripts.check_license_compliance `
            .\dist\LoLReplayTool `
            --build-provenance-sha256 $env:BUILD_PROVENANCE_SHA256

      - name: Run packaged self-check
        shell: pwsh
        run: |
          .\scripts\run_packaged_self_check.ps1 `
            -AppExe .\dist\LoLReplayTool\LoLReplayTool.exe `
            -TempRoot $env:RUNNER_TEMP `
            -TimeoutSeconds 60

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1 `
            -PythonExe $env:WINDOWS_PYTHON `
            -BuildProvenance $env:BUILD_PROVENANCE `
            -BuildProvenanceSha256 $env:BUILD_PROVENANCE_SHA256 `
            -InnoSetupRoot $env:INNO_SETUP_ROOT `
            -InnoSetupProvenance $env:INNO_SETUP_PROVENANCE `
            -SkipTests `
            -SkipBuild `
            -SkipSelfCheck

      - name: Audit finished installer contents
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          .\scripts\audit_installer_contents.ps1 `
            -InstallerPath ".\dist\installer\LoLReplayTool-Setup-$version.exe" `
            -DistributionRoot .\dist\LoLReplayTool `
            -TempRoot $env:RUNNER_TEMP `
            -PythonExe $env:WINDOWS_PYTHON

      - name: Test installer audit failure isolation
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          .\scripts\test_installer_audit_failure.ps1 `
            -InstallerPath ".\dist\installer\LoLReplayTool-Setup-$version.exe" `
            -DistributionRoot .\dist\LoLReplayTool `
            -TempRoot $env:RUNNER_TEMP `
            -PythonExe $env:WINDOWS_PYTHON

      - name: Stage private validation evidence
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path .\.ci-evidence | Out-Null
          Copy-Item `
            -LiteralPath $env:BUILD_PROVENANCE `
            -Destination .\.ci-evidence\build-provenance.json
          Copy-Item `
            -LiteralPath ".\dist\installer\LoLReplayTool-Setup-$version.exe" `
            -Destination .\.ci-evidence\

      - name: Preserve private validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opencv-ipp-free-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: .ci-evidence/
