name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Ruff check
        run: python -m ruff check .

      - name: Create test settings
        run: |
          mkdir -p config
          cp config/setting.sample.json config/setting.json

      - name: Run tests
        run: xvfb-run -a python -m pytest -p no:cacheprovider tests

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: utf8
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up bootstrap Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Prepare locked Python runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-runtime"
          $runtimeCache = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-runtime-cache"
          $basePython = Join-Path $runtimeRoot "python.exe"
          $venvRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-test-venv"
          $jobPython = Join-Path $venvRoot "Scripts\python.exe"

          python -m scripts.prepare_release_assets `
            prepare-python-runtime `
            --components .\compliance\components.json `
            --cache-dir $runtimeCache `
            --output-dir $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m scripts.prepare_release_assets `
            verify-python-runtime `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $jobPython -m scripts.prepare_release_assets `
            verify-bootstrap-pip `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WINDOWS_PYTHON=$jobPython" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install test dependencies
        shell: pwsh
        run: |
          & $env:WINDOWS_PYTHON -m pip `
            --isolated `
            --disable-pip-version-check `
            install `
            --no-input `
            --require-virtualenv `
            -r requirements-dev.txt

      - name: Prepare test environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.tmp" | Out-Null
          Copy-Item .\config\setting.sample.json .\config\setting.json -Force

      - name: Run tests
        shell: pwsh
        env:
          TEMP: ${{ github.workspace }}\.tmp
          TMP: ${{ github.workspace }}\.tmp
          PYTEST_BASETEMP: ${{ github.workspace }}\.pytest-tmp
        run: |
          & $env:WINDOWS_PYTHON -m pytest `
            -p no:cacheprovider `
            --basetemp="$env:PYTEST_BASETEMP" `
            tests

  build-windows:
    name: Build Windows artifact
    runs-on: windows-latest
    needs: [lint-test, test-windows]
    env:
      PYTHONIOENCODING: utf8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up bootstrap Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Prepare locked Python runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-runtime"
          $runtimeCache = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-runtime-cache"
          $basePython = Join-Path $runtimeRoot "python.exe"
          $venvRoot = Join-Path $env:RUNNER_TEMP "LoLReplayTool-build-venv"
          $jobPython = Join-Path $venvRoot "Scripts\python.exe"

          python -m scripts.prepare_release_assets `
            prepare-python-runtime `
            --components .\compliance\components.json `
            --cache-dir $runtimeCache `
            --output-dir $runtimeRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m scripts.prepare_release_assets `
            verify-python-runtime `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $basePython -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $jobPython -m scripts.prepare_release_assets `
            verify-bootstrap-pip `
            --components .\compliance\components.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WINDOWS_PYTHON=$jobPython" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install build dependencies
        shell: pwsh
        run: |
          & $env:WINDOWS_PYTHON -m pip `
            --isolated `
            --disable-pip-version-check `
            install `
            --no-input `
            --require-virtualenv `
            -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application
        shell: pwsh
        run: .\scripts\build.ps1 -PythonExe $env:WINDOWS_PYTHON

      - name: Validate packaged license materials
        shell: pwsh
        run: |
          & $env:WINDOWS_PYTHON -m scripts.check_license_compliance `
            .\dist\LoLReplayTool

      - name: Run packaged self-check
        shell: pwsh
        run: .\dist\LoLReplayTool\LoLReplayTool.exe --self-check

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1 `
            -PythonExe $env:WINDOWS_PYTHON `
            -SkipTests `
            -SkipBuild
