name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Release tag must use v1.2.3 or v1.2.3.4 format: $tag"
          }

          $tagVersion = $Matches[1]
          $fileVersion = (Get-Content .\VERSION -Raw).Trim()
          if ($tagVersion -ne $fileVersion) {
            throw "Tag version $tagVersion does not match VERSION $fileVersion."
          }

          "APP_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Build installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version $env:APP_VERSION

      - name: Create checksum
        shell: pwsh
        run: |
          $installerName = "LoLReplayTool-Setup-$env:APP_VERSION.exe"
          $installerPath = Join-Path .\dist\installer $installerName
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not generated: $installerPath"
          }

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content .\dist\installer\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = ".\dist\installer\LoLReplayTool-Setup-$env:APP_VERSION.exe"
          $checksums = ".\dist\installer\SHA256SUMS.txt"
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($env:APP_VERSION)
          $sectionPattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          $section = [regex]::Match($changelog, $sectionPattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md does not contain a section for $env:APP_VERSION."
          }

          $installNotes = @'
          ## インストール前の注意

          - リプレイ再生には64bit版のmpv DLLが別途必要です。
          - mpv DLLは`%LOCALAPPDATA%\LoLReplayTool\bin`へ配置してください。
          - OBSとFFmpegは必要になった時点でアプリが自動取得します。
          - `SHA256SUMS.txt`でインストーラーの整合性を確認できます。
          '@
          $releaseNotes = "$($section.Value.Trim())`n`n$installNotes"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksums --clobber
          } else {
            gh release create $tag $installer $checksums `
              --verify-tag `
              --title "LoL Replay Tool $tag" `
              --notes $releaseNotes `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
