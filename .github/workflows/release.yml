name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Release tag must use v1.2.3 or v1.2.3.4 format: $tag"
          }

          $tagVersion = $Matches[1]
          $fileVersion = (Get-Content .\VERSION -Raw).Trim()
          if ($tagVersion -ne $fileVersion) {
            throw "Tag version $tagVersion does not match VERSION $fileVersion."
          }

          "APP_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Build installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version $env:APP_VERSION

      - name: Create source and license archives
        shell: pwsh
        run: |
          $installerName = "LoLReplayTool-Setup-$env:APP_VERSION.exe"
          $installerPath = Join-Path .\dist\installer $installerName
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not generated: $installerPath"
          }

          python -m scripts.check_license_compliance .\dist\LoLReplayTool
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $sourceName = "LoLReplayTool-source-$env:APP_VERSION.zip"
          $sourcePath = Join-Path .\dist\installer $sourceName
          git archive --format=zip --output=$sourcePath HEAD
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $licenseName = "LoLReplayTool-license-materials-$env:APP_VERSION.zip"
          $licensePath = Join-Path .\dist\installer $licenseName
          $licenseStage = Join-Path $env:RUNNER_TEMP (
            "LoLReplayTool-license-materials-$env:APP_VERSION-" + [guid]::NewGuid().ToString("N")
          )
          New-Item -ItemType Directory -Path $licenseStage -Force | Out-Null
          Copy-Item .\dist\LoLReplayTool\LICENSE $licenseStage
          Copy-Item .\dist\LoLReplayTool\THIRD_PARTY_NOTICES.md $licenseStage
          Copy-Item .\dist\LoLReplayTool\SOURCE_OFFER.md $licenseStage
          Copy-Item .\dist\LoLReplayTool\VERSION $licenseStage
          Copy-Item .\dist\LoLReplayTool\licenses $licenseStage -Recurse
          Compress-Archive -Path "$licenseStage\*" -DestinationPath $licensePath -Force

          $artifactPaths = @($installerPath, $sourcePath, $licensePath)
          $checksumLines = foreach ($artifactPath in $artifactPaths) {
            $hash = (Get-FileHash $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $artifactPath -Leaf)"
          }
          $checksumLines | Set-Content .\dist\installer\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = ".\dist\installer\LoLReplayTool-Setup-$env:APP_VERSION.exe"
          $source = ".\dist\installer\LoLReplayTool-source-$env:APP_VERSION.zip"
          $licenses = ".\dist\installer\LoLReplayTool-license-materials-$env:APP_VERSION.zip"
          $checksums = ".\dist\installer\SHA256SUMS.txt"
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $englishChangelog = Get-Content .\CHANGELOG.en.md -Raw
          $escapedVersion = [regex]::Escape($env:APP_VERSION)
          $sectionPattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          $section = [regex]::Match($changelog, $sectionPattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md does not contain a section for $env:APP_VERSION."
          }
          $englishSection = [regex]::Match($englishChangelog, $sectionPattern)
          if (-not $englishSection.Success) {
            throw "CHANGELOG.en.md does not contain a section for $env:APP_VERSION."
          }

          $installNotes = @'
          ## インストール前の注意

          - リプレイ再生には64bit版のmpv DLLが別途必要です。
          - mpv DLLは`%LOCALAPPDATA%\LoLReplayTool\bin`へ配置してください。
          - OBSとFFmpegは必要になった時点でアプリが自動取得します。
          - 本ソフトウェアはGPL-3.0-onlyです。対応ソースと第三者ライセンス資料をReleaseへ添付しています。
          - `SHA256SUMS.txt`で公開ファイルの整合性を確認できます。
          '@
          $englishInstallNotes = @'
          ## Before installation

          - Replay playback requires a separate 64-bit mpv DLL.
          - Place the mpv DLL in `%LOCALAPPDATA%\LoLReplayTool\bin`.
          - The application downloads OBS and FFmpeg when they are needed.
          - This software is GPL-3.0-only. Corresponding source and third-party license materials are attached.
          - Use `SHA256SUMS.txt` to verify the published files.
          '@
          $releaseNotes = @"
          # 日本語

          $($section.Value.Trim())

          $installNotes

          ---

          # English

          $($englishSection.Value.Trim())

          $englishInstallNotes
          "@

          $existingReleases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($existingReleases.tagName -contains $tag) {
            throw "Release $tag already exists. Do not replace published binaries; publish a new version instead."
          }

          gh release create $tag $installer $source $licenses $checksums `
            --verify-tag `
            --title "LoL Replay Tool $tag" `
            --notes $releaseNotes

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
