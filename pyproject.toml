[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "bin",
    "obs-portable",
    "recordings",
    "dist",
    "build",
    "logs",
    "tests/_tmp",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # formatter handles wrapping where safe; keep legacy strings readable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_tmp", ".git", ".ruff_cache", ".pytest_cache", "build", "dist"]
